<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ρουτίνες">

<title>Ρουτίνες Γιώργου &amp; Αχιλλέα</title>

<style>
/* Layout: a header row (greeting + morning/evening switch), then two equal columns, one per child,
   whose task cards stretch to fill the screen height. Morning is a warm daylight look, evening a night-sky look. */
:root {
  --ground: #FFF4E0;
  --panel: #FFFFFF;
  --card: #FFF9EF;
  --line: #EFE0C4;
  --ink: #2B2342;
  --sub: #6A5F7E;
  --accent: #B8650F;
  --accent-tint: rgba(232, 144, 42, 0.16);
  --tab-on: #2B2342;
  --tab-on-ink: #FFF4E0;
  --on-kid: #FFFFFF;
  --done-tile: rgba(255, 255, 255, 0.22);
  --g: #2F6BD1;
  --g-tint: rgba(47, 107, 209, 0.11);
  --a: #C9551E;
  --a-tint: rgba(201, 85, 30, 0.11);
  --font-display: 'Comfortaa', 'Commissioner', ui-rounded, system-ui, -apple-system, sans-serif;
  --font-body: 'Commissioner', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
:root[data-mode="evening"] {
  --ground: #161A33;
  --panel: #20264A;
  --card: #283063;
  --line: #343D74;
  --ink: #F4EFE4;
  --sub: #B3B8DA;
  --accent: #F6C85F;
  --accent-tint: rgba(246, 200, 95, 0.14);
  --tab-on: #F6C85F;
  --tab-on-ink: #161A33;
  --on-kid: #161A33;
  --done-tile: rgba(22, 26, 51, 0.14);
  --g: #6BB0FF;
  --g-tint: rgba(107, 176, 255, 0.16);
  --a: #FF9F66;
  --a-tint: rgba(255, 159, 102, 0.16);
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  transition: background-color 0.4s, color 0.4s;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.ic { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.app {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 1.25em;
  padding:
    max(1.5em, env(safe-area-inset-top, 0px))
    max(1.4em, env(safe-area-inset-right, 0px))
    max(1.3em, env(safe-area-inset-bottom, 0px))
    max(1.4em, env(safe-area-inset-left, 0px));
  font-size: clamp(14px, min(2.3vw, 1.6vh), 26px);
}

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1em; }
.greet { display: flex; align-items: center; gap: 0.85em; min-width: 0; }
.sky {
  width: 3.5em; height: 3.5em; flex: none; border-radius: 50%;
  background: var(--accent-tint); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.sky .ic { width: 2.1em; height: 2.1em; }
.date { font-size: 0.9em; font-weight: 600; color: var(--sub); text-transform: capitalize; }
h1 {
  margin: 0.15em 0 0;
  font-family: var(--font-display); font-weight: 700; font-size: 2em; line-height: 1.1;
  text-wrap: balance;
}
.controls { display: flex; align-items: center; gap: 0.55em; }
.switch { display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--panel); }
.switch button {
  min-height: max(44px, 2.75em);
  padding: 0 1.05em 0 0.85em;
  border: 0; border-radius: 999px;
  background: transparent; color: var(--sub);
  display: flex; align-items: center; gap: 0.4em;
  font-family: var(--font-display); font-weight: 700; font-size: 0.95em;
  cursor: pointer;
  transition: background-color 0.25s, color 0.25s;
}
.switch button .ic { width: 1.3em; height: 1.3em; }
.switch button[aria-pressed="true"] { background: var(--tab-on); color: var(--tab-on-ink); }
.reset {
  min-width: max(48px, 2.75em); height: max(48px, 2.75em);
  padding: 0 0.7em;
  border-radius: 999px; border: 2px solid var(--line);
  background: transparent; color: var(--sub);
  display: flex; align-items: center; justify-content: center; gap: 0.35em;
  font-family: var(--font-display); font-weight: 700; font-size: 0.9em;
  cursor: pointer;
}
.reset .ic { width: 1.35em; height: 1.35em; }
.reset.armed { background: var(--accent); border-color: var(--accent); color: var(--ground); }

/* Board */
.board {
  flex: 1 1 0; min-height: 0;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.05em;
}
.kid {
  --kid: var(--g); --kid-tint: var(--g-tint);
  display: flex; flex-direction: column; gap: 0.85em;
  padding: 1.05em 0.95em 0.95em;
  border-radius: 1.6em;
  background: var(--panel);
  box-shadow: 0 0 0 4px transparent;
  min-height: 0; min-width: 0;
  transition: box-shadow 0.3s, background-color 0.4s;
}
.kid-a { --kid: var(--a); --kid-tint: var(--a-tint); }
.kid.complete { box-shadow: 0 0 0 4px var(--kid); }
.kid-head { display: flex; align-items: center; gap: 0.75em; min-height: 4em; }
.avatar {
  font-size: 1.55em; width: 2.15em; height: 2.15em; flex: none; border-radius: 50%;
  background: var(--kid); color: var(--on-kid);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700;
}
.kid-meta { display: flex; flex-direction: column; gap: 0.35em; min-width: 0; }
h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.45em; line-height: 1.1; }
.progress { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0.55em; color: var(--sub); font-weight: 600; font-size: 0.85em; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 5px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); transition: background-color 0.25s; }
.dot.on { background: var(--kid); }
.bravo {
  margin: 0; display: flex; align-items: center; gap: 0.3em;
  color: var(--accent); font-family: var(--font-display); font-weight: 700; font-size: 1.05em;
}
.bravo .ic { width: 1.25em; height: 1.25em; fill: currentColor; }
.cheer .bravo { animation: cheer 0.7s cubic-bezier(.3, 1.6, .5, 1); }

.tasks {
  list-style: none; margin: 0; padding: 0;
  display: flex; flex-direction: column; gap: 0.55em;
  flex: 1 1 0; min-height: 0;
}
.tasks li { flex: 1 1 0; min-height: 0; max-height: 8em; display: flex; }
.task {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 0.75em;
  padding: 0.35em 0.75em 0.35em 0.5em;
  border-radius: 1.2em;
  border: 3px solid var(--line);
  background: var(--card); color: var(--ink);
  font-family: var(--font-display); font-weight: 700; font-size: 1.07em;
  text-align: left; cursor: pointer;
  transition: background-color 0.25s, border-color 0.25s, color 0.25s, transform 0.1s;
}
.task:active { transform: scale(0.98); }
.tile {
  width: 3.05em; height: 3.05em; flex: none; border-radius: 0.8em;
  background: var(--kid-tint); color: var(--kid);
  display: flex; align-items: center; justify-content: center;
  transition: background-color 0.25s, color 0.25s;
}
.tile .ic { width: 60%; height: 60%; }
.kid-a .task { font-size: 1.12em; }
.kid-a .tile { width: 3.5em; height: 3.5em; }
.label { flex: 1 1 auto; min-width: 0; line-height: 1.2; }
.check {
  width: 1.9em; height: 1.9em; flex: none; box-sizing: border-box; border-radius: 50%;
  border: 3px solid var(--line); background: transparent; color: var(--kid);
  display: flex; align-items: center; justify-content: center;
}
.check .ic { width: 70%; height: 70%; stroke-width: 3; opacity: 0; }
.task.done { background: var(--kid); border-color: var(--kid); color: var(--on-kid); }
.task.done .tile { background: var(--done-tile); color: var(--on-kid); }
.task.done .check { background: var(--on-kid); border-color: var(--on-kid); }
.task.done .check .ic { opacity: 1; }
.task.pop .check { animation: pop 0.4s cubic-bezier(.3, 1.6, .5, 1); }

@keyframes pop { 0% { transform: scale(0.4); } 100% { transform: scale(1); } }
@keyframes cheer { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* Phone width: columns stack and the page scrolls */
@media (max-width: 640px) {
  html, body { height: auto; min-height: 100%; }
  .app { height: auto; min-height: 100%; }
  .board { grid-template-columns: 1fr; flex: none; }
  .tasks, .tasks li { flex: none; }
  .tasks li { min-height: 4.4em; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<div class="app">
  <header class="top">
    <div class="greet">
      <div class="sky" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><use id="skyIcon" href="#i-sun"/></svg></div>
      <div>
        <div class="date" id="date"></div>
        <h1 id="title">Ώρα για σχολείο</h1>
      </div>
    </div>
    <div class="controls">
      <div class="switch" role="group" aria-label="Ρουτίνα">
        <button type="button" id="tab-morning" data-pick="morning" aria-pressed="true">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sun"/></svg><span>Πρωί</span>
        </button>
        <button type="button" id="tab-evening" data-pick="evening" aria-pressed="false">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon"/></svg><span>Βράδυ</span>
        </button>
      </div>
      <button type="button" class="reset" id="reset" aria-label="Ξανά από την αρχή" title="Ξανά από την αρχή">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-reset"/></svg><span id="resetText" hidden>Σίγουρα;</span>
      </button>
    </div>
  </header>
  <main class="board" id="board"></main>
</div>

<script>
// ---- The routines. Edit these lists to change the tasks. ----
// Each task is [icon, label]. Icons: toys, bath, pajamas, shirt, tooth, toilet, book, moon,
// heart, drop, bowl, shoe, bag, door, sun, star.
const ROUTINES = {
  morning: {
    g: [
      ['toilet', 'Τουαλέτα'],
      ['drop', 'Πλένω το πρόσωπο'],
      ['shirt', 'Ντύνομαι'],
      ['bowl', 'Τρώω πρωινό'],
      ['tooth', 'Πλένω τα δόντια'],
      ['shoe', 'Φοράω παπούτσια'],
      ['bag', 'Παίρνω την τσάντα'],
      ['door', 'Μπουφάν & φεύγουμε']
    ],
    a: [
      ['toilet', 'Τουαλέτα'],
      ['shirt', 'Ντύνομαι'],
      ['bowl', 'Πρωινό'],
      ['tooth', 'Δοντάκια'],
      ['shoe', 'Παπούτσια'],
      ['door', 'Μπουφάν & πάμε']
    ]
  },
  evening: {
    g: [
      ['toys', 'Μαζεύω τα παιχνίδια'],
      ['bath', 'Μπάνιο'],
      ['pajamas', 'Φοράω πιτζάμες'],
      ['bag', 'Ετοιμάζω την τσάντα'],
      ['toilet', 'Τουαλέτα'],
      ['tooth', 'Πλένω τα δόντια'],
      ['book', 'Διαβάζουμε παραμύθι'],
      ['moon', 'Φιλάκι & καληνύχτα']
    ],
    a: [
      ['toys', 'Μαζεύουμε παιχνίδια'],
      ['bath', 'Μπάνιο'],
      ['pajamas', 'Πιτζάμες'],
      ['toilet', 'Τουαλέτα'],
      ['tooth', 'Δοντάκια'],
      ['book', 'Παραμύθι'],
      ['heart', 'Αγκαλιά & ύπνος']
    ]
  }
};

const KIDS = [
  { id: 'g', name: 'Γιώργος', voc: 'Γιώργο', initial: 'Γ' },
  { id: 'a', name: 'Αχιλλέας', voc: 'Αχιλλέα', initial: 'Α' }
];

// Morning runs from 04:00 until 14:00; evening the rest of the day.
const MORNING_FROM = 4;
const EVENING_FROM = 14;

const TITLES = { morning: 'Ώρα για σχολείο', evening: 'Ώρα για ύπνο' };
const STORE_KEY = 'kids-routines-v1';

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function autoMode() {
  const h = new Date().getHours();
  return h >= MORNING_FROM && h < EVENING_FROM ? 'morning' : 'evening';
}

const state = { day: today(), done: {}, pick: null, pickAuto: null, shown: null };

try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved && saved.date === state.day && saved.done) state.done = saved.done;
} catch (e) {}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ date: state.day, done: state.done })); } catch (e) {}
}

// A manual pick holds until the clock crosses into the other routine.
function currentMode() {
  const auto = autoMode();
  return state.pick && state.pickAuto === auto ? state.pick : auto;
}

function keyOf(mode, kid, i) { return mode + ':' + kid + ':' + i; }

function isComplete(mode, kidId) {
  return ROUTINES[mode][kidId].every((_, i) => state.done[keyOf(mode, kidId, i)]);
}

const els = {
  root: document.documentElement,
  theme: document.getElementById('themeColor'),
  sky: document.getElementById('skyIcon'),
  date: document.getElementById('date'),
  title: document.getElementById('title'),
  board: document.getElementById('board'),
  tabs: document.querySelectorAll('[data-pick]'),
  reset: document.getElementById('reset'),
  resetText: document.getElementById('resetText')
};

function render(opts) {
  opts = opts || {};
  const mode = currentMode();
  state.shown = mode;
  els.root.dataset.mode = mode;
  els.theme.setAttribute('content', mode === 'evening' ? '#161A33' : '#FFF4E0');
  els.sky.setAttribute('href', mode === 'evening' ? '#i-moon' : '#i-sun');
  els.title.textContent = TITLES[mode];
  try {
    els.date.textContent = new Date().toLocaleDateString('el-GR', { weekday: 'long', day: 'numeric', month: 'long' });
  } catch (e) { els.date.textContent = ''; }
  els.tabs.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pick === mode)));

  els.board.innerHTML = KIDS.map(kid => {
    const list = ROUTINES[mode][kid.id];
    let count = 0;
    const tasks = list.map(([icon, label], i) => {
      const key = keyOf(mode, kid.id, i);
      const done = !!state.done[key];
      if (done) count++;
      const pop = done && opts.pop === key ? ' pop' : '';
      return '<li><button type="button" class="task' + (done ? ' done' : '') + pop + '" data-key="' + key + '" aria-pressed="' + done + '">' +
        '<span class="tile" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><use href="#i-' + icon + '"/></svg></span>' +
        '<span class="label">' + label + '</span>' +
        '<span class="check" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><use href="#i-check"/></svg></span>' +
        '</button></li>';
    }).join('');
    const dots = list.map((_, i) => '<span class="dot' + (state.done[keyOf(mode, kid.id, i)] ? ' on' : '') + '"></span>').join('');
    const complete = count === list.length;
    const status = complete
      ? '<p class="bravo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>Μπράβο ' + kid.voc + '!</p>'
      : '<p class="progress"><span class="dots" aria-hidden="true">' + dots + '</span><span>' + count + ' / ' + list.length + '</span></p>';
    const classes = 'kid kid-' + kid.id + (complete ? ' complete' : '') + (opts.cheer === kid.id ? ' cheer' : '');
    return '<section class="' + classes + '" aria-label="' + kid.name + '">' +
      '<div class="kid-head"><div class="avatar" aria-hidden="true">' + kid.initial + '</div>' +
      '<div class="kid-meta"><h2>' + kid.name + '</h2>' + status + '</div></div>' +
      '<ul class="tasks">' + tasks + '</ul></section>';
  }).join('');
}

els.board.addEventListener('click', e => {
  const btn = e.target.closest('.task');
  if (!btn) return;
  const key = btn.dataset.key;
  const [mode, kidId] = key.split(':');
  const wasComplete = isComplete(mode, kidId);
  if (state.done[key]) delete state.done[key]; else state.done[key] = true;
  save();
  const nowComplete = isComplete(mode, kidId);
  render({ pop: key, cheer: !wasComplete && nowComplete ? kidId : null });
});

els.tabs.forEach(b => b.addEventListener('click', () => {
  state.pick = b.dataset.pick;
  state.pickAuto = autoMode();
  render();
}));

// Reset asks once: the first tap arms it for 3 seconds, the second clears the routine on screen.
let armTimer = null;
function disarm() {
  clearTimeout(armTimer);
  els.reset.classList.remove('armed');
  els.resetText.hidden = true;
}
els.reset.addEventListener('click', () => {
  if (!els.reset.classList.contains('armed')) {
    els.reset.classList.add('armed');
    els.resetText.hidden = false;
    armTimer = setTimeout(disarm, 3000);
    return;
  }
  disarm();
  const mode = currentMode();
  Object.keys(state.done).forEach(k => { if (k.indexOf(mode + ':') === 0) delete state.done[k]; });
  save();
  render();
});

// New day: clear the ticks. Also follow the clock from morning to evening.
setInterval(() => {
  const d = today();
  if (d !== state.day) {
    state.day = d;
    state.done = {};
    state.pick = null;
    save();
    render();
  } else if (currentMode() !== state.shown) {
    render();
  }
}, 30000);

// Keep the iPad screen awake while the page is open, where the browser allows it.
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { wakeLock = null; }
}
document.addEventListener('pointerdown', keepAwake);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { keepAwake(); render(); }
});

render();
</script>
</body>
